# Deze site is platte HTML: er is niets te bouwen, alleen te publiceren.
# Alleen de map site/ gaat online. Deze configuratie, de readme en de
# broncode van de function blijven daardoor buiten het publieke domein.
[build]
  publish = "site"
  command = ""

# Netlify schrijft standaard interne links om van `diensten.html` naar
# `/diensten`. De pagina blijft dan op beide adressen bereikbaar, terwijl de
# canonical en de sitemap `.html` aanhouden — links en canonical spreken
# elkaar dan tegen. Uit, zodat alles dezelfde URL-vorm gebruikt.
[build.processing.html]
  pretty_urls = false

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), interest-cohort=()"
    # De site haalt niets bij derden op, dus dit mag streng. Het enige externe
    # verkeer is de POST van het afspraakformulier naar Formspree.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://formspree.io; form-action 'self' https://formspree.io; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

# Fonts en libraries zijn versievast; een jaar cache scheelt elke bezoeker
# na het eerste bezoek alle downloads.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
